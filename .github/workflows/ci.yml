name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow only needs to read the repository. The default token grant is
# broader than that, and a compromised action would inherit whatever it is.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than "latest": a silent toolchain bump should show up as a
  # deliberate commit, not as a mystery CI failure.
  # v1.7.4 (TLC 2.19, Aug 2024) predates -dumpTrace, which tlakit passes on
  # every run, so every check fails there with exit 1. v1.8.0 is the first
  # release that has it.
  TLA_TOOLS_TAG: v1.8.0
  COMMUNITY_MODULES_TAG: "202607311834"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing in CI pushes; a leftover token in the runner is only
          # ever useful to something that should not have it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # The java-marked tests skip without a JRE, which would quietly turn the
      # matrix green while testing nothing that matters.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the TLA+ jars
        id: jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tools
          key: tla-${{ env.TLA_TOOLS_TAG }}-cm-${{ env.COMMUNITY_MODULES_TAG }}

      - name: Download the TLA+ jars
        if: steps.jars.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p tools
          curl -sSfL -o tools/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_TAG}/tla2tools.jar"
          curl -sSfL -o tools/CommunityModules-deps.jar \
            "https://github.com/tlaplus/CommunityModules/releases/download/${COMMUNITY_MODULES_TAG}/CommunityModules-deps.jar"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,notebook]"

      - name: Test
        shell: bash
        env:
          TLAKIT_TLA2TOOLS: ${{ github.workspace }}/tools/tla2tools.jar
          TLAKIT_COMMUNITY_MODULES: ${{ github.workspace }}/tools/CommunityModules-deps.jar
        run: python -m pytest -q

      - name: Fail if the Java-marked tests were skipped
        shell: bash
        env:
          TLAKIT_TLA2TOOLS: ${{ github.workspace }}/tools/tla2tools.jar
        run: |
          # A green run that skipped every integration test proves nothing.
          python -m pytest -q -m java --no-header -rN | tee result.txt
          grep -qE "[0-9]+ passed" result.txt

      - name: Execute the example notebooks
        shell: bash
        env:
          TLAKIT_TLA2TOOLS: ${{ github.workspace }}/tools/tla2tools.jar
          TLAKIT_COMMUNITY_MODULES: ${{ github.workspace }}/tools/CommunityModules-deps.jar
        run: python -m pytest -q --nbmake examples/

      - name: Import must not require Java
        shell: bash
        run: |
          # tlakit is a library others embed; importing it must never shell out.
          env -u TLAKIT_TLA2TOOLS python -c "import tlakit; print(tlakit.__version__)"
