name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `analyze` is a required check, so it has to report on the queue's own
  # branch too; see the note in ci.yml.
  merge_group:
  schedule:
    # Weekly, so a newly published rule finds old code without waiting for a push.
    - cron: "0 7 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: python,javascript
          # The landing page ships inline JS, and the service handles untrusted
          # input, so both are worth scanning.
          queries: security-extended
      - uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
