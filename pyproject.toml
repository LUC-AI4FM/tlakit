[project]
name = "tlakit"
version = "0.0.1"
description = "A Python and notebook client for the TLA+ toolchain"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eric Spencer" }]
keywords = ["tla+", "tlaplus", "tlc", "model-checking", "formal-methods", "jupyter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["platformdirs>=4.0"]

# `tlakit.cli` is the CliRunner -- the thing that shells out to java -- so the
# command line lives in `cli_main` rather than shadowing it.
[project.scripts]
tlakit = "tlakit.cli_main:main"

[project.urls]
Homepage = "https://github.com/LUC-AI4FM/tlakit"
Repository = "https://github.com/LUC-AI4FM/tlakit"
Issues = "https://github.com/LUC-AI4FM/tlakit/issues"
"Try it in a browser" = "https://tlakit.pages.dev"

[project.optional-dependencies]
notebook = ["ipython>=8.0"]
kernel = ["ipykernel>=6.0", "jupyter-client>=7.0"]
# python-multipart backs the raw .tla upload on /check (#64). FastAPI raises
# at import time for a multipart route without it, so it is a hard dependency
# of this extra rather than something to probe for at runtime.
serve = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0", "python-multipart>=0.0.9"]
widget = ["anywidget>=0.9", "traitlets>=5.0"]
# Upper-bounded on purpose: MkDocs 2.0 removes the plugin system outright, so
# mkdocstrings -- which is how the API pages exist at all -- stops working on
# it. Better a pin that must be revisited deliberately than a docs job that
# fails one morning for a reason nobody in this repo caused.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.24,<1"]
dev = ["pytest>=8.0", "pytest-timeout>=2.0", "nbmake>=1.5", "ipykernel>=6.0", "jupyter-client>=7.0", "nbclient>=0.9", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27", "python-multipart>=0.0.9", "anywidget>=0.9", "traitlets>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlakit"]
artifacts = ["src/tlakit/serve/static/*.html"]

[tool.hatch.build.targets.sdist]
# The sdist is "everything needed to rebuild and test", not the working tree.
# Without these it swallows the JupyterLite build venv and its 64 MB output --
# hatchling refuses outright on the venv, which is how this was noticed.
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/lite/files",
    "/lite/serve.py",
    "/lite/requirements-build.txt",
    "/lite/README.md",
    "/README.md",
    "/SECURITY.md",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "/lite/wheels",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "java: requires Java and tla2tools.jar",
    "apalache: requires the apalache-mc launcher",
    "tlaps: requires the tlapm binary",
    "mcp: requires node and a vscode-tlaplus checkout",
]
