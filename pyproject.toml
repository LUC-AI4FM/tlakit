[project]
name = "tlakit"
version = "0.1.0.dev0"
description = "A Python and notebook client for the TLA+ toolchain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eric Spencer" }]
dependencies = ["platformdirs>=4.0"]

[project.optional-dependencies]
notebook = ["ipython>=8.0"]
dev = ["pytest>=8.0", "pytest-timeout>=2.0", "nbmake>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["java: requires Java and tla2tools.jar"]
